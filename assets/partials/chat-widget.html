<div class="its-chat" data-chat-widget>
  <button class="its-chat-launcher" type="button" aria-haspopup="dialog" aria-controls="its-chat-panel" aria-expanded="false" hidden>Chat with us</button>
  <dialog class="its-chat-panel" id="its-chat-panel" aria-labelledby="its-chat-title">
    <div class="its-chat-heading">
      <h2 id="its-chat-title">ITSIPL Assistant</h2>
      <a href="https://company-chatbot-5c6r.onrender.com/" target="_blank" rel="noopener noreferrer">Open in new tab<span class="sr-only"> (opens a new tab)</span></a>
      <button class="its-chat-close" type="button" aria-label="Close chat" autofocus>&times;</button>
    </div>
    <p class="its-chat-status" role="status" hidden></p>
    <div class="its-chat-content"></div>
  </dialog>
</div>
